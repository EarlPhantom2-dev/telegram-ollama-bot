version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-container
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - bot-network

  telegram-bot:
    build: .
    container_name: telegram-bot
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - bot-network
    restart: always

volumes:
  ollama-data:

networks:
  bot-network:
    driver: bridge
